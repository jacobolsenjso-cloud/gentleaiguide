# Laver manglende illustrationer på robottens grene — på GitHub, ikke i skyen.
#
# Hvorfor: sky-sessionens sikkerhedsfilter blokerer kommandoen, der kalder
# Cloudflare med en nøgle, uanset tilladelsesregler. GitHub Actions har ikke
# den begrænsning, og nøglen ligger sikkert i repoets Secrets (som på
# techfeedwatch). Så robotten skriver artiklen + motivet, pusher grenen, og
# dette job tegner billedet og lægger det på samme gren. Pull request'en
# opdateres af sig selv.
#
# Kører ved push til draft/*-grene, eller manuelt (Actions → Illustrate →
# Run workflow) med et artikelnummer.
name: Illustrate

on:
  push:
    branches: ['draft/**']
  workflow_dispatch:
    inputs:
      number:
        description: 'Artikelnummer (order) — tom = alle der mangler billede'
        required: false

permissions:
  contents: write

jobs:
  illustrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Finder de artikler i scripts/illustrations.json, der mangler en PNG.
      - name: Find manglende billeder
        id: find
        run: |
          if [ -n "${{ github.event.inputs.number }}" ]; then
            echo "numbers=${{ github.event.inputs.number }}" >> "$GITHUB_OUTPUT"
          else
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("scripts/illustrations.json", "utf8"));
              const missing = Object.entries(cfg.articles)
                .filter(([n, a]) => !fs.existsSync(`public/images/articles/${String(n).padStart(2, "0")}-${a.slug}.png`))
                .map(([n]) => n);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `numbers=${missing.join(" ")}\n`);
              console.log("mangler:", missing.join(" ") || "(ingen)");
            '
          fi

      - name: Tegn billederne
        if: steps.find.outputs.numbers != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/illustrate.mjs ${{ steps.find.outputs.numbers }}

      - name: Commit billederne til grenen
        if: steps.find.outputs.numbers != ''
        run: |
          git config user.name "gentle-ai-guide-bot"
          git config user.email "hello@gentleaiguide.com"
          git add public/images/articles/*.png
          if git diff --cached --quiet; then echo "Intet nyt billede"; exit 0; fi
          git commit -m "Illustrate: article ${{ steps.find.outputs.numbers }} (generated by GitHub Actions)"
          git push
